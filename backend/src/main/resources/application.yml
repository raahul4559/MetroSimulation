server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: metro-simulation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/metro_simulation}
    username: ${DB_USERNAME:metro_user}
    password: ${DB_PASSWORD:metro_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

simulation:
  tick-interval-ms: ${SIMULATION_TICK_INTERVAL_MS:1000}
  time-scale: ${SIMULATION_TIME_SCALE:1.0}

announcement:
  audio:
    # Empty by default — the feature degrades gracefully (frontend falls back to browser speech
    # synthesis, then text-only captions) until a real key is provided. See docs/architecture.md.
    google-tts-api-key: ${GOOGLE_CLOUD_TTS_API_KEY:}
    cache-dir: ${ANNOUNCEMENT_AUDIO_CACHE_DIR:./data/audio-cache}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    voice-en: ${GOOGLE_TTS_VOICE_EN:en-IN-Neural2-A}
    voice-hi: ${GOOGLE_TTS_VOICE_HI:hi-IN-Neural2-A}
    voice-kn: ${GOOGLE_TTS_VOICE_KN:kn-IN-Standard-A}

# Realtime digital twin — see docs/realtime.md. Every external endpoint is configuration and empty by
# default, which leaves that provider UNCONFIGURED (never polled, never guessed). With nothing
# configured, AUTO mode falls back to the simulation and labels it as such.
realtime:
  mode: ${REALTIME_MODE:AUTO}
  publish-interval-ms: ${REALTIME_PUBLISH_INTERVAL_MS:1000}
  stale-after: ${REALTIME_STALE_AFTER:90s}
  expire-after: ${REALTIME_EXPIRE_AFTER:5m}
  max-clock-skew: ${REALTIME_MAX_CLOCK_SKEW:30s}
  max-snap-distance-metres: ${REALTIME_MAX_SNAP_DISTANCE_METRES:1500}
  max-backoff: ${REALTIME_MAX_BACKOFF:5m}
  official:
    url: ${REALTIME_OFFICIAL_URL:}
    auth-header-name: ${REALTIME_OFFICIAL_AUTH_HEADER_NAME:Authorization}
    auth-header-value: ${REALTIME_OFFICIAL_AUTH_HEADER_VALUE:}
    poll-interval: ${REALTIME_OFFICIAL_POLL_INTERVAL:15s}
  gtfs:
    vehicle-positions-url: ${REALTIME_GTFS_VEHICLE_POSITIONS_URL:}
    trip-updates-url: ${REALTIME_GTFS_TRIP_UPDATES_URL:}
    alerts-url: ${REALTIME_GTFS_ALERTS_URL:}
    auth-header-name: ${REALTIME_GTFS_AUTH_HEADER_NAME:}
    auth-header-value: ${REALTIME_GTFS_AUTH_HEADER_VALUE:}
    poll-interval: ${REALTIME_GTFS_POLL_INTERVAL:15s}
    # Feed identifiers -> this network's codes. Unmapped ids fall back to matching station/line codes.
    # mapping:
    #   stop-ids: { "<feed stop_id>": MAJESTIC }
    #   route-ids: { "<feed route_id>": PURPLE }
    #   direction-ids: { 0: OUTBOUND, 1: INBOUND }
  timetable:
    # Cite the published BMRCL notice these hours come from. Left empty on purpose: no hours are
    # assumed. Example shape (NOT real hours — replace from the official source):
    # source: "BMRCL notice <ref>, effective <date>"
    # service-day-rollover: "03:00"
    # holidays: [2026-11-01]
    # lines:
    #   PURPLE:
    #     weekday:
    #       - { from: "HH:mm", to: "HH:mm", headway-seconds: 300 }
    #     sunday:
    #       - { from: "HH:mm", to: "HH:mm", headway-seconds: 600 }
    # Date-specific exceptions (lines omitted = all lines):
    # exceptions:
    #   - { date: 2026-11-01, type: RUN_AS, run-as: SUNDAY, note: "Kannada Rajyotsava" }
    #   - { date: 2026-12-31, type: SPECIAL_HOURS, lines: [PURPLE], note: "New Year's Eve extension",
    #       periods: [ { from: "HH:mm", to: "HH:mm", headway-seconds: 300 } ] }
    #   - { date: 2026-10-20, type: CLOSED, lines: [YELLOW], note: "Maintenance block" }
    source: ""
